version: "3.8"

services:
  # 1. THE DATABASE (This was missing!)
  db:
    image: ankane/pgvector:latest
    container_name: amoeba-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amoeba
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d amoeba"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1.5. Redis for Rate Limiting
  redis:
    image: redis:alpine
    container_name: amoeba-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. The Backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backups:/backups
    env_file:
      - ./backend/.env
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. The Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/amoeba

  # 4. CADDY REVERSE PROXY (For Domain & SSL)
  caddy:
    image: caddy:latest
    container_name: amoeba-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

# Persistent Storage for DB
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backups:
