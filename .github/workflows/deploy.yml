name: Auto-Deploy to Hostinger VPS

on:
  push:
    branches:
      - main  # Now it will trigger whenever you merge into the main branch!

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd amoeba-ai
            git checkout main
            git pull
            # Restart only the containers that have changes, or build new ones if needed
            docker compose up -d --build
